services:
  aspen-dev-box:
    networks:
      - aspen-net
      - evergreen-net

  aspen-db:
    networks:
      - aspen-net
      - evergreen-net

  evergreen-import-init:
    image: docker:cli
    attach: false
    restart: 'no'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "$ASPEN_DOCKER/scripts/setup_evergreen_import.sh:/setup.sh:ro"
    command: ["sh", "/setup.sh"]
    environment:
      - EVERGREEN_STACK=${EVERGREEN_STACK:-egdev}
    depends_on:
      aspen-dev-box:
        condition: service_healthy

networks:
  evergreen-net:
    external: true
    name: ${EVERGREEN_STACK:-egdev}_egnet
